<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fffbea" />
<title>연결이 끊겼어요 · 계획은 J가</title>
<!--
  인터넷이 끊겼을 때 서비스 워커(public/sw.js)가 미리 저장해 둔 이 화면을 보여 준다.
  오프라인이라 바깥 파일(글꼴·이미지·스크립트)을 못 받으니 전부 이 파일 안에 둔다. 색은 globals.css 와 같다.
-->
<style>
  :root {
    color-scheme: light;
    --cream: #fffbea;
    --surface: #ffffff;
    --ink: #22223b;
    --muted: #4a4a68;
    --coral: #ff6b6b;
    --yellow: #ffd84d;
    --mint: #3ccfb4;
    --lavender: #b8b5ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: ui-rounded, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
    /* 칸 너비를 화면에 묶어야 긴 문장이 화면 밖으로 밀지 않는다 */
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; text-align: center; }

  /* ── 그림: 노란 해 위에서 꾸벅 조는 핀, 끊긴 점선 길 ───────── */
  .art { position: relative; width: min(68vw, 250px, 32vh); aspect-ratio: 1; }
  .art svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .pin { transform-origin: 100px 150px; animation: doze 3.2s ease-in-out infinite; }
  .zzz text { font: 700 15px/1 ui-rounded, system-ui, sans-serif; fill: var(--ink); opacity: 0; animation: float 3.2s ease-out infinite; }
  .zzz text:nth-child(2) { animation-delay: 1.05s; }
  .zzz text:nth-child(3) { animation-delay: 2.1s; }
  @keyframes doze { 0%, 100% { transform: rotate(-3deg) translateY(0); } 50% { transform: rotate(3deg) translateY(3px); } }
  @keyframes float { 0% { opacity: 0; transform: translate(0, 6px); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(10px, -22px); } }

  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 8px; padding: 6px 14px;
    border: 2.5px solid var(--ink); border-radius: 999px;
    background: var(--surface);
    font-size: 14px; font-weight: 700;
    transform: rotate(-2deg);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 0 rgb(255 107 107 / .6); animation: ping 1.6s ease-out infinite; }
  @keyframes ping { 70% { box-shadow: 0 0 0 8px rgb(255 107 107 / 0); } 100% { box-shadow: 0 0 0 0 rgb(255 107 107 / 0); } }
  .chip[data-state="online"] { background: var(--mint); }
  .chip[data-state="online"] .dot { background: var(--ink); animation: none; }

  h1 { margin: 18px 0 0; font-size: clamp(26px, 7.4vw, 32px); line-height: 1.3; letter-spacing: -0.01em; }
  h1 mark { background: var(--yellow); color: inherit; border-radius: 12px; padding: 0 6px; }
  .lead { margin: 12px 0 0; font-size: 16px; line-height: 1.75; color: var(--muted); }

  .retry {
    margin-top: 22px; height: 56px; padding: 0 28px;
    display: inline-flex; align-items: center; gap: 8px;
    border: 3px solid var(--ink); border-radius: 18px;
    background: var(--coral); color: var(--ink);
    font: inherit; font-size: 19px; font-weight: 800;
    box-shadow: 3px 3px 0 var(--ink);
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .retry:hover { transform: translateY(-2px); }
  .retry:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .retry:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  .retry svg { width: 20px; height: 20px; }
  .retry[aria-busy="true"] svg { animation: spin .8s linear infinite; }
  .retry.nope { animation: nope .35s ease; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes nope { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  .note { min-height: 1.6em; margin: 12px 0 0; font-size: 14px; font-weight: 700; color: var(--muted); }

  .tips {
    width: 100%; margin: 14px 0 0; padding: 16px 18px;
    text-align: left;
    border: 2.5px solid var(--ink); border-radius: 20px;
    background: var(--surface);
    font-size: 14.5px; line-height: 1.6;
  }
  .tips p { margin: 0 0 8px; font-weight: 800; }
  .tips ul { margin: 0; padding: 0; list-style: none; }
  .tips li { display: flex; gap: 10px; }
  .tips li + li { margin-top: 6px; }
  .tips li::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: .55em; border-radius: 50%; background: var(--lavender); box-shadow: 0 0 0 2px var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .zzz text { opacity: 1; }
  }
</style>
</head>
<body>
<main>
  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="86" fill="#FFD84D" stroke="#22223B" stroke-width="3" />
      <!-- 길이 가운데서 끊겼다 -->
      <path d="M22 156 C 46 146, 60 162, 78 156" fill="none" stroke="#22223B" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round" />
      <path d="M124 156 C 146 150, 164 160, 180 138" fill="none" stroke="#22223B" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round" />
      <ellipse cx="100" cy="158" rx="22" ry="5" fill="#22223B" opacity=".15" />
      <g class="pin">
        <path d="M100 152s-34-33-34-60a34 34 0 0 1 68 0c0 27-34 60-34 60z" fill="#FF6B6B" stroke="#22223B" stroke-width="3.5" stroke-linejoin="round" />
        <!-- 꾸벅 조는 눈 -->
        <path d="M82 88q6 5 12 0M106 88q6 5 12 0" fill="none" stroke="#22223B" stroke-width="3.2" stroke-linecap="round" />
        <ellipse cx="80" cy="99" rx="6" ry="3.6" fill="#FF9FB0" />
        <ellipse cx="120" cy="99" rx="6" ry="3.6" fill="#FF9FB0" />
        <path d="M95 102q5 3 10 0" fill="none" stroke="#22223B" stroke-width="3" stroke-linecap="round" />
      </g>
      <g class="zzz">
        <text x="136" y="62">z</text>
        <text x="146" y="50">z</text>
        <text x="156" y="38">Z</text>
      </g>
      <circle cx="40" cy="58" r="9" fill="#3CCFB4" stroke="#22223B" stroke-width="3" />
      <path d="M160 160 l14 -4 l-4 14 l-3 -5 z" fill="#B8B5FF" stroke="#22223B" stroke-width="2.5" stroke-linejoin="round" />
    </svg>
  </div>

  <span class="chip" id="status" data-state="offline" role="status" aria-live="polite">
    <span class="dot" aria-hidden="true"></span><span id="status-text">연결을 기다리는 중</span>
  </span>

  <h1>인터넷도 잠깐<br /><mark>연휴</mark> 중이에요</h1>
  <p class="lead">연결이 돌아오면 보던 화면을<br />바로 다시 불러올게요.</p>

  <button class="retry" id="retry" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6" /><path d="M20 4v5h-5" /></svg>
    다시 시도
  </button>
  <p class="note" id="note" aria-live="polite"></p>

  <section class="tips" aria-labelledby="tips-title">
    <p id="tips-title">이렇게 해 보세요</p>
    <ul>
    <li>비행기 모드가 켜져 있다면 꺼 주세요.</li>
    <li>와이파이와 모바일 데이터를 바꿔 보세요.</li>
    <li>연결되면 이 화면이 알아서 넘어가요.</li>
    </ul>
  </section>
</main>

<script>
  (function () {
    var button = document.getElementById("retry");
    var note = document.getElementById("note");
    var chip = document.getElementById("status");
    var chipText = document.getElementById("status-text");
    var busy = false;

    // navigator.onLine 은 와이파이에만 붙어 있어도 true 라 실제로 서버에 닿는지 한 번 물어본다.
    function reachable() {
      return fetch("/manifest.webmanifest?ping=" + Date.now(), { cache: "no-store" })
        .then(function (res) { return res.ok; })
        .catch(function () { return false; });
    }

    function attempt(fromButton) {
      if (busy) return;
      busy = true;
      button.setAttribute("aria-busy", "true");
      note.textContent = fromButton ? "연결을 확인하는 중이에요…" : "";
      reachable().then(function (ok) {
        if (ok) {
          chip.dataset.state = "online";
          chipText.textContent = "연결됐어요! 다시 불러오는 중";
          location.reload();
          return;
        }
        busy = false;
        button.removeAttribute("aria-busy");
        if (fromButton) {
          note.textContent = "아직 연결이 안 됐어요. 조금 뒤 다시 눌러 주세요.";
          button.classList.remove("nope");
          void button.offsetWidth;
          button.classList.add("nope");
        }
      });
    }

    button.addEventListener("click", function () { attempt(true); });
    window.addEventListener("online", function () { attempt(false); });
    // online 이벤트를 놓치는 기기도 있어 탭이 보일 때와 몇 초마다 조용히 확인한다.
    document.addEventListener("visibilitychange", function () { if (!document.hidden) attempt(false); });
    setInterval(function () { if (!document.hidden) attempt(false); }, 8000);
  })();
</script>
</body>
</html>
