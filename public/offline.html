<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#faf5ec" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1f3340" media="(prefers-color-scheme: dark)" />
<title>연결이 끊겼어요 · 뇌빼고</title>
<!--
  인터넷이 끊겼을 때 서비스 워커(public/sw.js)가 미리 저장해 둔 이 화면을 보여 준다.
  오프라인이라 바깥 파일(글꼴·이미지·스크립트)을 못 받으니 전부 이 파일 안에 둔다. 색은 globals.css 와 같다.
-->
<style>
  :root {
    color-scheme: light dark;
    --cream: #faf5ec;
    --surface: #fffdf9;
    --ink: #2a2622;
    --muted: #6b6257;
    --coral: #ff7a6b;
    --yellow: #ffd34f;
    --mint: #3ccfb4;
    --lavender: #b8b5ff;
    --line: rgb(42 38 34 / .12);
  }
  /* 어두운 화면 — globals.css 의 「밤바다」와 같다. 그림은 선이 진해서 그대로 둔다 */
  @media (prefers-color-scheme: dark) {
    :root {
      --cream: #1f3340;
      --surface: #2c3f4b;
      --ink: #fff3dc;
      --muted: #cfc6b6;
      --line: rgb(255 243 220 / .14);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: ui-rounded, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
    /* 칸 너비를 화면에 묶어야 긴 문장이 화면 밖으로 밀지 않는다 */
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; text-align: center; }

  /* ── 그림: 하늘색 원 안에서 튜브 타고 꾸벅 조는 뇌, 머리 위로 z z Z ───────── */
  .art { position: relative; width: min(64vw, 230px, 30vh); aspect-ratio: 1; }
  .sleeper { position: absolute; inset: 0; width: 100%; height: 100%; transform-origin: 50% 75%; animation: doze 3.2s ease-in-out infinite; }
  .zzz { position: absolute; right: 2%; top: 4%; width: 30%; height: 30%; }
  .zzz i { position: absolute; font: normal 800 18px/1 ui-rounded, system-ui, sans-serif; color: var(--muted); opacity: 0; animation: float 3.2s ease-out infinite; }
  .zzz i:nth-child(1) { left: 0; bottom: 0; }
  .zzz i:nth-child(2) { left: 30%; bottom: 30%; animation-delay: 1.05s; }
  .zzz i:nth-child(3) { left: 60%; bottom: 60%; font-size: 22px; animation-delay: 2.1s; }
  @keyframes doze { 0%, 100% { transform: rotate(-2deg) translateY(0); } 50% { transform: rotate(2deg) translateY(3px); } }
  @keyframes float { 0% { opacity: 0; transform: translate(0, 6px); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(10px, -22px); } }

  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 8px; padding: 6px 14px;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--surface);
    font-size: 14px; font-weight: 700;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 0 rgb(255 107 107 / .6); animation: ping 1.6s ease-out infinite; }
  @keyframes ping { 70% { box-shadow: 0 0 0 8px rgb(255 107 107 / 0); } 100% { box-shadow: 0 0 0 0 rgb(255 107 107 / 0); } }
  .chip[data-state="online"] { background: var(--mint); color: #2a2622; }
  .chip[data-state="online"] .dot { background: #2a2622; animation: none; }

  h1 { margin: 18px 0 0; font-size: clamp(26px, 7.4vw, 32px); line-height: 1.3; letter-spacing: -0.01em; }
  h1 mark { background: var(--yellow); color: #2a2622; border-radius: 12px; padding: 0 6px; }
  .lead { margin: 12px 0 0; font-size: 16px; line-height: 1.75; color: var(--muted); }

  .retry {
    margin-top: 22px; height: 56px; padding: 0 28px;
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid rgb(0 0 0 / .08); border-radius: 18px;
    background: var(--coral); color: #2a2622; /* 코랄 위 글자는 어두운 화면에서도 진하게 */
    font: inherit; font-size: 19px; font-weight: 800;
    box-shadow: 0 1px 2px rgb(0 0 0 / .05), 0 4px 14px -6px rgb(0 0 0 / .25);
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .retry:hover { transform: translateY(-2px); }
  .retry:active { transform: scale(.97); }
  .retry:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  .retry svg { width: 20px; height: 20px; }
  .retry[aria-busy="true"] svg { animation: spin .8s linear infinite; }
  .retry.nope { animation: nope .35s ease; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes nope { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  .note { min-height: 1.6em; margin: 12px 0 0; font-size: 14px; font-weight: 700; color: var(--muted); }

  .tips {
    width: 100%; margin: 14px 0 0; padding: 16px 18px;
    text-align: left;
    border: 1px solid var(--line); border-radius: 24px;
    background: var(--surface);
    box-shadow: 0 10px 28px -10px rgb(0 0 0 / .18);
    font-size: 14.5px; line-height: 1.6;
  }
  .tips p { margin: 0 0 8px; font-weight: 800; }
  .tips ul { margin: 0; padding: 0; list-style: none; }
  .tips li { display: flex; gap: 10px; }
  .tips li + li { margin-top: 6px; }
  .tips li::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: .55em; border-radius: 50%; background: var(--lavender); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .zzz i { opacity: .8; }
  }
</style>
</head>

<script>
  (function () {
    var button = document.getElementById("retry");
    var note = document.getElementById("note");
    var chip = document.getElementById("status");
    var chipText = document.getElementById("status-text");
    var busy = false;

    // navigator.onLine 은 와이파이에만 붙어 있어도 true 라 실제로 서버에 닿는지 한 번 물어본다.
    function reachable() {
      return fetch("/manifest.webmanifest?ping=" + Date.now(), { cache: "no-store" })
        .then(function (res) { return res.ok; })
        .catch(function () { return false; });
    }

    function attempt(fromButton) {
      if (busy) return;
      busy = true;
      button.setAttribute("aria-busy", "true");
      note.textContent = fromButton ? "연결을 확인하는 중이에요…" : "";
      reachable().then(function (ok) {
        if (ok) {
          chip.dataset.state = "online";
          chipText.textContent = "연결됐어요! 다시 불러오는 중";
          location.reload();
          return;
        }
        busy = false;
        button.removeAttribute("aria-busy");
        if (fromButton) {
          note.textContent = "아직 연결이 안 됐어요. 조금 뒤 다시 눌러 주세요.";
          button.classList.remove("nope");
          void button.offsetWidth;
          button.classList.add("nope");
        }
      });
    }

    button.addEventListener("click", function () { attempt(true); });
    window.addEventListener("online", function () { attempt(false); });
    // online 이벤트를 놓치는 기기도 있어 탭이 보일 때와 몇 초마다 조용히 확인한다.
    document.addEventListener("visibilitychange", function () { if (!document.hidden) attempt(false); });
    setInterval(function () { if (!document.hidden) attempt(false); }, 8000);
  })();
</script>
</body>
